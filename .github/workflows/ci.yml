name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  # Upstream branch pushes do not trigger this repository's CI; check them daily too.
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:python
      - run: pnpm build
      - name: Verify VSIX packaging without publishing
        if: runner.os == 'Linux'
        run: pnpm exec vsce package --no-dependencies --allow-missing-repository --out "${{ runner.temp }}/manim-cue-ci.vsix"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # Chrome supplies the H.264 decoder used by the real seek/playback fixture.
      - run: pnpm exec playwright-core install --with-deps chrome
      - run: pnpm test:ui

  editor:
    name: Activation (VS Code ${{ matrix.code }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        code: ['1.96.0', stable]
    env:
      VSCODE_VERSION: ${{ matrix.code }}
      # Compatible with the advertised editor floor; do not pick an unbounded latest extension.
      PYTHON_EXTENSION_VERSION: '2024.22.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: xvfb-run -a pnpm test:vscode:activation

  native:
    name: Native Manim (preview branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MANIM_BRANCH: refactor/manager-targeted-frame
      VSCODE_VERSION: stable
      PYTHON_EXTENSION_VERSION: '2024.22.2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install native libraries, fonts and headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev ffmpeg fonts-dejavu-core xvfb libegl1 libopengl0
      - run: pnpm install --frozen-lockfile
      - name: Create isolated Manim environment
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/cue-manim"
          echo "MANIM_PYTHON=$RUNNER_TEMP/cue-manim/bin/python" >> "$GITHUB_ENV"
      - name: Install the current preview branch
        # Refresh VCS resolution even if uv restored a cached version of this branch.
        run: uv pip install --python "$MANIM_PYTHON" --refresh-package manim "manim @ git+https://github.com/ManimCommunity/manim.git@$MANIM_BRANCH"
      - name: Record resolved revision and dependencies
        run: |
          "$MANIM_PYTHON" - <<'PY'
          from importlib.metadata import distribution
          import json
          import os
          import sys

          package = distribution("manim")
          source = json.loads(package.read_text("direct_url.json"))
          vcs = source["vcs_info"]
          assert vcs["vcs"] == "git" and vcs["requested_revision"] == os.environ["MANIM_BRANCH"], source
          report = (f"Manim branch: {os.environ['MANIM_BRANCH']}\n"
                    f"Resolved commit: {vcs['commit_id']}\n"
                    f"Package version: {package.version}\nPython: {sys.version}\n")
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Native Manim environment\n```text\n" + report + "```\n")
          PY
          uv pip freeze --python "$MANIM_PYTHON"
      - name: Check required Manim capabilities
        run: |
          "$MANIM_PYTHON" python/support.py diagnose - "$RUNNER_TEMP/cue-manim-diagnostic.json"
          "$MANIM_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "cue-manim-diagnostic.json").read_text(encoding="utf-8"))
          print(json.dumps(report, indent=2))
          assert report["status"] == "ready", "The preview branch no longer provides all required Cue APIs."
          PY
      - run: pnpm build
      - run: pnpm test:integration
      - run: xvfb-run -a pnpm test:vscode

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'behackl/manim-cue'
    needs: [checks, browser, editor, native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag and metadata
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected_tag="v$version"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must match package version $version ($expected_tag)."
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag must point to a commit on main."
            exit 1
          fi
          if ! grep -Fxq "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version."
            exit 1
          fi
          preview="$(node -p "require('./package.json').preview === true ? 'true' : 'false'")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
          echo "vsix=manim-cue-$version.vsix" >> "$GITHUB_OUTPUT"
      - name: Package extension
        shell: bash
        run: |
          if [ "${{ steps.release.outputs.preview }}" = "true" ]; then
            pnpm package:pre-release
          else
            pnpm package
          fi
          test -f "${{ steps.release.outputs.vsix }}"
      - name: Publish exact VSIX to Visual Studio Marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Add the Marketplace token as the VSCE_PAT repository secret."
            exit 1
          fi
          args=(publish --packagePath "${{ steps.release.outputs.vsix }}" --skip-duplicate)
          if [ "${{ steps.release.outputs.preview }}" = "true" ]; then
            args+=(--pre-release)
          fi
          pnpm exec vsce "${args[@]}"
      - name: Create GitHub release with the same VSIX
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.release.outputs.vsix }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.release.outputs.vsix }}" \
              --verify-tag \
              --title "Manim Cue ${{ steps.release.outputs.version }}" \
              --generate-notes
          fi
